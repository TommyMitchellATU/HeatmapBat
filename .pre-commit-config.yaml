repos:
  # Code hygiene hooks to keep diffs small and avoid cross-OS issues
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Linting/formatting via Ruff (fast and consistent with CI)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--config", "backend/pyproject.toml", "backend"]
      - id: ruff-format
        name: ruff (format)
        args: ["--config", "backend/pyproject.toml", "backend"]

  # Type-checking with mypy using the repo's pyproject settings
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: []
        args: ["--config-file", "backend/pyproject.toml", "-p", "app"]
        pass_filenames: false
