<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HeatmapBat – MapLibre Heatmap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- MapLibre GL JS from CDN -->
    <link
      href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.min.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      header {
        padding: 0.5rem 1rem;
        background: #111827;
        color: #f9fafb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      header h1 {
        font-size: 1rem;
        margin: 0;
      }

      header .controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
      }

      header label {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }

      header input[type="datetime-local"] {
        font-size: 0.8rem;
        padding: 0.1rem 0.2rem;
      }

      header button {
        padding: 0.25rem 0.75rem;
        border-radius: 0.25rem;
        border: none;
        background: #2563eb;
        color: #f9fafb;
        cursor: pointer;
      }

      header button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      #map {
        flex: 1;
      }

      .status {
        font-size: 0.75rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>HeatmapBat – Activity Heatmap</h1>
        <div class="controls">
          <label>
            Start
            <input id="start" type="datetime-local" />
          </label>
          <label>
            End
            <input id="end" type="datetime-local" />
          </label>
          <button id="load">Load</button>
          <span class="status" id="status"></span>
        </div>
      </header>
      <div id="map"></div>
    </div>

    <script>
      // Basic MapLibre initialisation.
      const map = new maplibregl.Map({
        container: "map",
        style: "https://demotiles.maplibre.org/style.json", // public demo style
        center: [-7.0, 54.0], // Roughly Ireland; adjust as needed
        zoom: 6,
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");

      const statusEl = document.getElementById("status");
      const startInput = document.getElementById("start");
      const endInput = document.getElementById("end");
      const loadBtn = document.getElementById("load");
      // Single mode: precomputed H3 cells served from the analytics layer.

      // Utility to build query parameters from the two datetime inputs.
      // If no dates are provided, this returns an empty string so that the
      // backend returns all data in the database.
      function buildQuery() {
        const params = new URLSearchParams();
        if (startInput.value) {
          const d = new Date(startInput.value);
          params.set("start", d.toISOString().slice(0, 10)); // date-only
        }
        if (endInput.value) {
          const d = new Date(endInput.value);
          params.set("end", d.toISOString().slice(0, 10));
        }
        params.set("analytics_dir", "/data/analytics/h3_daily");
        const qs = params.toString();
        return qs ? `?${qs}` : "";
      }

      async function fetchData() {
        const qs = buildQuery();
        statusEl.textContent = "Loading precomputed H3 cells...";
        loadBtn.disabled = true;
        try {
          const path = "/api/heatmap/h3";

          const resp = await fetch(`${path}${qs}`);
          if (!resp.ok) {
            throw new Error(`HTTP ${resp.status}`);
          }
          const data = await resp.json();

          const totalRaw = data.reduce(
            (acc, p) => acc + (p.raw_count_sum || 0),
            0,
          );
          const totalSamples = data.reduce(
            (acc, p) => acc + (p.sample_count || 0),
            0,
          );

          statusEl.textContent = `Loaded ${data.length} H3 cells (raw sum=${totalRaw.toFixed(
            1,
          )}, samples=${totalSamples})`;

          return data;
        } catch (err) {
          console.error(err);
          statusEl.textContent = "Failed to load H3 cells";
          return [];
        } finally {
          loadBtn.disabled = false;
        }
      }

      // Convert the H3 parquet API response into a GeoJSON FeatureCollection
      // that MapLibre can consume directly as a source. Each feature
      // represents a single aggregated H3 cell.
      function toGeoJSON(data) {
        return {
          type: "FeatureCollection",
          features: data.map((p) => ({
            type: "Feature",
            geometry: {
              type: "Point",
              coordinates: [p.lon, p.lat],
            },
            properties: {
              // Use effort_normalised_weight (or raw_count) as heatmap weight.
              weight: p.effort_normalised_weight ?? p.raw_count ?? 0,
              raw_count: p.raw_count ?? 0,
              effort_normalised_weight: p.effort_normalised_weight ?? 0,
              h3_index: p.h3_index,
            },
          })),
        };
      }

      function toPolygonGeoJSON(data) {
        return {
          type: "FeatureCollection",
          features: data.map((p) => ({
            type: "Feature",
            geometry: {
              type: "Polygon",
              // Single ring polygon; backend already provides [lon, lat] pairs.
              coordinates: [p.polygon],
            },
            properties: {
              weight: p.raw_count_sum,
              raw_count_sum: p.raw_count_sum,
              sample_count: p.sample_count,
              h3_index: p.h3_index,
            },
          })),
        };
      }

      async function loadHeatmap() {
        const data = await fetchData();
        const pointGeojson = toGeoJSON(data);

        const pointSourceId = "heatmap-points";
        const heatLayerId = "heatmap-layer";
        const hexSourceId = "heatmap-hexes";
        const hexFillLayerId = "heatmap-hex-fill";
        const hexLineLayerId = "heatmap-hex-outline";

        // Update or create point heatmap source/layer.
        if (map.getSource(pointSourceId)) {
          map.getSource(pointSourceId).setData(pointGeojson);
        } else {
          map.addSource(pointSourceId, { type: "geojson", data: pointGeojson });
          map.addLayer({
            id: heatLayerId,
            type: "heatmap",
            source: pointSourceId,
            maxzoom: 15,
            paint: {
              // Increase the heatmap weight based on point weight property.
              "heatmap-weight": ["interpolate", ["linear"], ["get", "weight"], 0, 0, 10, 1],

              // Increase the heatmap intensity as zoom level increases.
              "heatmap-intensity": ["interpolate", ["linear"], ["zoom"], 0, 1, 15, 3],

              // Color ramp for heatmap.
              "heatmap-color": [
                "interpolate",
                ["linear"],
                ["heatmap-density"],
                0,
                "rgba(33,102,172,0)",
                0.2,
                "rgb(103,169,207)",
                0.4,
                "rgb(209,229,240)",
                0.6,
                "rgb(253,219,199)",
                0.8,
                "rgb(239,138,98)",
                1,
                "rgb(178,24,43)",
              ],

              // Adjust the heatmap radius by zoom level.
              "heatmap-radius": [
                "interpolate",
                ["linear"],
                ["zoom"],
                0,
                2,
                9,
                20,
              ],

              // Transition from heatmap to circle layer by zoom level if
              // circles are added later; for now keep opacity fixed.
              "heatmap-opacity": 0.9,
            },
          });
        }

        if (data.length && data[0].polygon) {
          const hexGeojson = toPolygonGeoJSON(data);

          // Update or create hex polygon source.
          if (map.getSource(hexSourceId)) {
            map.getSource(hexSourceId).setData(hexGeojson);
          } else {
            map.addSource(hexSourceId, { type: "geojson", data: hexGeojson });

            // Semi-transparent fill to show cell extent.
            map.addLayer({
              id: hexFillLayerId,
              type: "fill",
              source: hexSourceId,
              paint: {
                "fill-color": "#3b82f6",
                "fill-opacity": 0.15,
              },
            });

            // Outline for clearer hex boundaries.
            map.addLayer({
              id: hexLineLayerId,
              type: "line",
              source: hexSourceId,
              paint: {
                "line-color": "#1d4ed8",
                "line-width": 1.0,
                "line-opacity": 0.8,
              },
            });
          }
        }
      }

      loadBtn.addEventListener("click", () => {
        loadHeatmap();
      });

      // Once the map style has loaded, fetch and render an initial heatmap
      // without any explicit time filter.
      map.on("load", () => {
        loadHeatmap();
      });
    </script>
  </body>
</html>
