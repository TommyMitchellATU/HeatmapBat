        const siteWindow = rows.length ? { first: rows[0].night, last: rows.at(-1).night } : null;
        const surveyed = detectionCurve.filter(r => r.observed_rate != null);
        const inside = surveyed.filter(insideRateRange).length;
        const hasRange = surveyed.some(r => r.rate_lo != null);
        const c = SEASON_CHART_COLORS;
        const pct = Math.round(detectionCurve[0].interval * 100);
        const key = [
          seasonKeyItem(`<circle cx="7" cy="5" r="2.5" fill="${c.inside}"/>`, "Observed rate, inside range"),
          seasonKeyItem(`<circle cx="7" cy="5" r="2.5" fill="${c.outside}"/>`, "outside range"),
          ...(hasRange ? [seasonKeyItem(`<line x1="7" x2="7" y1="0" y2="10" stroke="${c.whisker}" stroke-width="${DETECTION_CHART_WHISKER_PX}"/>`, `${pct}% range for that night's detectors`)] : []),
          seasonKeyItem(`<rect width="14" height="10" fill="${c.band}"/>`, `${pct}% credible band of p`),
          seasonKeyItem(`<line x1="0" x2="14" y1="5" y2="5" stroke="${c.median}" stroke-width="1.5"/>`, "Model p (median)"),
          ...(siteWindow ? [seasonKeyItem(`<rect width="14" height="10" fill="${c.surveyWindow}" opacity="0.6"/>`, "This site's survey")] : []),
          seasonKeyItem(`<line x1="7" x2="7" y1="0" y2="10" stroke="${c.current}" stroke-width="2"/>`, "Timeline night"),
        ];
        setSeasonPanelText("Detection probability - all sites",
          `${formatDateShort(detectionCurve[0].night)} - ${formatDate(detectionCurve.at(-1).night)}, M2`, `
          ${detectionChartSvg(detectionCurve, siteWindow, timelineData[currentDateIndex]?.date)}
          <div class="season-panel-key">${key.join("")}</div>
          <div class="season-panel-note">
            Chance a detector records at least one bat pass in a night, averaged over detectors, for a night of average length.
            Dots: share of that night's detector-nights, across every site surveyed, that recorded a pass.
            ${hasRange
              ? `Grey bars: the range the model expects for that many randomly chosen detectors;
                 <strong>${inside} of ${surveyed.length}</strong> nights inside it. The blue band is only uncertainty about the curve itself.`
              : `<strong>${inside} of ${surveyed.length}</strong> inside the credible band (no per-night range in this file - rerun section 18).`}<br>
            <strong>Caution:</strong> each site was surveyed in its own window, so the seasonal trend is mixed up with differences between sites.
          </div>
        `);
      }
      // ===== EVENT LISTENERS =====
      document.getElementById("season-panel-close").addEventListener("click", closeSeasonPanel);
      seasonPanelTabs.forEach(btn => btn.addEventListener("click", () => {
        seasonPanelTab = btn.dataset.tab;
        renderSeasonPanel();
      }));
      viewButtons.forEach(btn => btn.addEventListener("click", () => setViewMode(btn.dataset.mode)));
      modelViewButtons.forEach(btn => btn.addEventListener("click", () => {
        modelView = btn.dataset.modelView;
        modelViewButtons.forEach(b => b.classList.toggle("active", b === btn));
        applyModelViewStyle();
        if (viewMode === "model" && timelineData.length) renderModelNight(timelineData[currentDateIndex].date);
      }));

      btnPlay.addEventListener("click", play);
      
      btnStart.addEventListener("click", () => {
        pause();
        goToDate(0);
      });
      
      btnEnd.addEventListener("click", () => {
        pause();
        goToDate(timelineData.length - 1);
      });
      
      btnPrev.addEventListener("click", () => {
        pause();
        if (currentDateIndex > 0) goToDate(currentDateIndex - 1);
      });
      
      btnNext.addEventListener("click", () => {
        pause();
        if (currentDateIndex < timelineData.length - 1) goToDate(currentDateIndex + 1);
      });
      
      slider.addEventListener("input", (e) => {
        pause();
        goToDate(parseInt(e.target.value));
      });
      
      speedSelector.addEventListener("change", (e) => {
        playSpeed = parseInt(e.target.value);
        if (isPlaying) {
          pause();
          play();
        }
      });
      
      cumulativeToggle.addEventListener("click", () => {
        isCumulative = !isCumulative;
        cumulativeToggle.classList.toggle("active", isCumulative);
        dataCache.clear(); // Clear cache as we need different queries
        goToDate(currentDateIndex);
      });

      // ===== INITIALIZATION =====
      document.getElementById("legend-activity-tiers").replaceChildren(...stopLegendItems(ACTIVITY_RATE_STOPS));

      map.on("load", () => {
        initTimeline();
        
        let zoomTimeout;
        map.on("zoomend", () => {
          clearTimeout(zoomTimeout);
          zoomTimeout = setTimeout(() => {
            if (viewMode === "model" && timelineData.length) renderModelNight(timelineData[currentDateIndex].date);
            else updateHexagonsForZoom();
          }, 150);
        });
      });
    </script>
  </body>
</html>
