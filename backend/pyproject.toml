# Project metadata and runtime dependencies
[project]
name = "heatmapbat"
version = "0.1.0"
description = "Effort-normalized Web GIS backend for bat activity"
readme = "README.md"
requires-python = ">=3.11"

# Runtime dependencies used by the API and (future) ETL
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psycopg[binary,pool]>=3.2",
  "redis>=5.0",
  "boto3>=1.35",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "h3>=4.1",
  "astral>=3.2",
  "python-dateutil>=2.9",
  "httpx>=0.27",
]

# Dev-only tooling used locally and in CI
[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
  "types-requests",
  "types-python-dateutil",
]

# Ruff (linter/formatter) configuration
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Black settings kept for editors/IDEs that auto-detect it (Ruff formats in CI)
[tool.black]
line-length = 100
target-version = ["py311"]

# mypy type-checker configuration
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
exclude = 'backend/app/backend($|/)|backend/app/backend/eti/backend($|/)'
explicit_package_bases = true
# Point mypy to the backend folder so `-p app` resolves when run from repo root
mypy_path = ["backend"]

[project]
name = "heatmapbat-backend"
version = "0.1.0"
description = "HeatmapBat FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
