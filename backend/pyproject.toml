[project]
name = "heatmapbat-backend"
version = "0.0.1"
description = "HeatmapBat backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27.0",
    "mypy>=1.10",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false