[project]
name = "heatmapbat-backend"
version = "0.0.1"
description = "HeatmapBat backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0",
    "redis>=5.0.0",
    "boto3",
    "botocore",
    "boto3-stubs[essential]",
    "h3>=4.3.1",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
]

[project.optional-dependencies]
dev = []  # keep empty; CI uses [tool.uv].dev-dependencies

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "httpx>=0.27.0",
    "mypy>=1.10",
    "ruff>=0.5.0",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
module = ["pandas", "h3"]
ignore_missing_imports = true
