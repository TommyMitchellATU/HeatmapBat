[project]
name = "heatmapbat-backend"
version = "0.1.0"
description = "FastAPI backend for HeatmapBat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
  "fastapi[standard]",
  "uvicorn[standard]",
  "httpx",
  "pydantic",
  "psycopg[binary]",
  "redis",
  "boto3",
  "pytest",
  "ruff",
  "mypy",
  "types-redis",
  "types-requests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["app/backend/eti/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/backend/tests"]
pythonpath = ["."]