name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-type-test:
    name: Lint / Type-check / Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync (dev)
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest -q

  compose-integration:
    name: Compose integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API /health
        run: |
          set -e
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs api
          exit 1

      - name: Install dev deps in api container
        run: docker compose exec -T -w /app api uv sync --dev

      - name: Run tests in api container
        run: docker compose exec -T -w /app api uv run pytest -q

      - name: Teardown
        if: always()
        run: docker compose down -v