name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint / Type-check / Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv virtualenv
        id: cache-uv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml', 'backend/uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Sync deps (project + dev extras)
        run: uv sync --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check
      - name: mypy
        run: uv run mypy .
      - name: Pytest
        run: uv run pytest -q

  compose-integration:
    name: Compose integration
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API /health
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 5
          done
          echo "API not ready"; docker compose logs api; exit 1

      - name: Run tests in container
        run: docker compose exec -T api uv run pytest -q

      - name: Teardown
        if: always()
        run: docker compose down -v